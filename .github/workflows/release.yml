name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: tablefmt-lsp
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: tablefmt-lsp
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: tablefmt-lsp
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: tablefmt-lsp
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: tablefmt-lsp.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build LSP binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }} -p tablefmt-lsp

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf tablefmt-lsp-${{ matrix.target }}.tar.gz ${{ matrix.binary_name }}
          mv tablefmt-lsp-${{ matrix.target }}.tar.gz ../../../

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf tablefmt-lsp-${{ matrix.target }}.tar.gz ${{ matrix.binary_name }}
          mv tablefmt-lsp-${{ matrix.target }}.tar.gz ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tablefmt-lsp-${{ matrix.target }}
          path: tablefmt-lsp-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
